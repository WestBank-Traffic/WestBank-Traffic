<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تطبيق الهاتف النقال في تحليل المسارات البديلة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0; padding: 0;
    }
    #control-box {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      background: white;
      padding: 3px;
      height: auto;
      border-radius: 5px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .leaflet-control-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #333;
      background-color: #fff;
      border-radius: 5px;
      margin: 0;
      width: 100%;
      padding-bottom: 5px;
    }
    .location-icon {
      background-color: #ff9800;
      border-radius: 50%;
      padding: 10px;
      color: white;
      cursor: pointer;
      font-size: 20px;
      position: absolute;
      top: 10%;
      left: 10px;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="control-box">
    <div class="leaflet-control-title">تطبيق الهاتف النقال في تحليل المسارات البديلة</div>
    <div id="manual-destination-input-container" style="display: none; width: 90%; flex-direction: column; align-items: center; margin-top: 10px;">
      <input type="text" id="destination-input" placeholder="أدخل الوجهة هنا (مثال: رام الله)" />
      <button id="get-directions-btn">الحصول على الاتجاهات</button>
    </div>
  </div>

  <div id="location-btn" class="location-icon">
    📍
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    var map = L.map('map').setView([31.9, 35.2], 9);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }).addTo(map);

    var userCoordinates = null;
    var routingControl = null;
    var destinationMarker = null;
    var roadLayer = null;

    // تحميل شبكة الطرق
    fetch('https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/Road.geojson')
      .then(response => response.json())
      .then(data => {
        roadLayer = L.geoJSON(data, {
          style: {
            color: 'blue',
            weight: 2,
            opacity: 0.7
          }
        }).addTo(map);
      }).catch(err => {
        console.error('خطأ في تحميل شبكة الطرق:', err);
        alert('حدث خطأ في تحميل شبكة الطرق.');
      });

    document.getElementById('location-btn').addEventListener('click', function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          userCoordinates = [position.coords.latitude, position.coords.longitude];

          if (destinationMarker) {
            destinationMarker.setLatLng(userCoordinates);
          } else {
            destinationMarker = L.marker(userCoordinates).addTo(map).bindPopup("موقعك الحالي").openPopup();
          }

          map.setView(userCoordinates, 13);
        }, function(error) {
          alert("تعذر الحصول على موقعك. يرجى التأكد من تمكين خدمات الموقع.");
          console.error("Error getting location:", error);
        });
      } else {
        alert("لم يتمكن المتصفح من الحصول على موقعك.");
      }
    });

    document.getElementById('get-directions-btn').addEventListener('click', function() {
      const destination = document.getElementById('destination-input').value.trim();

      if (!destination) {
        alert("الرجاء إدخال الوجهة.");
        return;
      }

      if (!userCoordinates) {
        alert("الرجاء تحديد موقعك الحالي أولاً باستخدام زر الموقع.");
        return;
      }

      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }

      if (destinationMarker) {
        map.removeLayer(destinationMarker);
        destinationMarker = null;
      }

      var geocoder = L.Control.Geocoder.nominatim();

      geocoder.geocode(destination, function(results) {
        if (results && results.length > 0) {
          const destinationLatLng = results[0].center;

          destinationMarker = L.marker(destinationLatLng).addTo(map).bindPopup(`نقطة النهاية: ${results[0].name}`).openPopup();
          map.setView(destinationLatLng, 14);

          // Call the function to calculate the route from GeoJSON network
          calculateRouteFromGeoJSON(userCoordinates, destinationLatLng);
        } else {
          alert('لم يتم العثور على الوجهة المحددة: ' + destination + '. الرجاء التحقق من الإدخال.');
        }
      });
    });

    function calculateRouteFromGeoJSON(startCoords, endCoords) {
      // خوارزمية Dijkstra أو A* (نحتاج إلى دمج خوارزمية هنا مع Network)
      // سنقوم بتحديد المسار باستخدام البيانات من شبكة الطرق geojson

      // هنا نقوم بإعداد المسار باستخدام **Dijkstra** أو **A\***
      // عليك استخدام خوارزمية لتحديد المسار بين النقاط (موقع المستخدم، الوجهة) باستخدام بيانات الشبكة.

      // حاليا نستخدم OSRM ولكن يمكنك تعديلها لاستخدام الخوارزميات المخصصة.
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(startCoords[0], startCoords[1]),
          L.latLng(endCoords.lat, endCoords.lng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1'
        }),
        routeWhileDragging: true,
        language: 'ar',
        showAlternatives: false,
        lineOptions: {
          styles: [{color: 'red', weight: 6, opacity: 0.8}]
        },
        collapsible: true
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        var routes = e.routes;
        var summary = routes[0].summary;
        alert('المسافة: ' + (summary.totalDistance / 1000).toFixed(2) + ' كم، المدة: ' + Math.round(summary.totalTime / 60) + ' دقيقة.');
      });

      routingControl.on('routingerror', function(e) {
        alert('لم يتم العثور على مسار للوجهة المحددة. يرجى التحقق من الوجهة أو المحاولة مرة أخرى.');
        console.error("Routing error:", e.error);
      });
    }
  </script>
</body>
</html>
