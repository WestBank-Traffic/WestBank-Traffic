<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تطبيق الهاتف النقال في تحليل المسارات البديلة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0; padding: 0;
    }
    #control-box {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      background: white;
      padding: 3px;
      height: auto;
      border-radius: 5px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .leaflet-control-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #333;
      background-color: #fff;
      border-radius: 5px;
      margin: 0;
      width: 100%;
      padding-bottom: 5px;
    }
    .location-icon {
      background-color: #ff9800;
      border-radius: 50%;
      padding: 10px;
      color: white;
      cursor: pointer;
      font-size: 20px;
      position: absolute;
      top: 10%;
      left: 10px;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="control-box">
    <div class="leaflet-control-title">تطبيق الهاتف النقال في تحليل المسارات البديلة</div>
    <div id="manual-destination-input-container" style="display: none; width: 90%; flex-direction: column; align-items: center; margin-top: 10px;">
      <input type="text" id="destination-input" placeholder="أدخل الوجهة هنا (مثال: رام الله)" />
      <button id="get-directions-btn">الحصول على الاتجاهات</button>
    </div>
  </div>

  <div id="location-btn" class="location-icon">
    📍
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/graphlib/2.1.1/graphlib.min.js"></script>

  <script>
    var map = L.map('map').setView([31.9, 35.2], 9);
    var userCoordinates = null;
    var routingControl = null;

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }).addTo(map);

    var userLocationMarker = null;

    document.getElementById('location-btn').addEventListener('click', function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          userCoordinates = [position.coords.latitude, position.coords.longitude];
          if (userLocationMarker) {
            userLocationMarker.setLatLng(userCoordinates);
          } else {
            userLocationMarker = L.marker(userCoordinates).addTo(map).bindPopup("موقعك الحالي").openPopup();
          }
          map.setView(userCoordinates, 13);
        }, function(error) {
          alert("تعذر الحصول على موقعك. يرجى التأكد من تمكين خدمات الموقع.");
          console.error("Error getting location:", error);
        });
      } else {
        alert("لم يتمكن المتصفح من الحصول على موقعك.");
      }
    });

    // خوارزمية Dijkstra
    function dijkstra(graph, start, end) {
      let distances = {};
      let previous = {};
      let nodes = new Set();

      graph.nodes().forEach(function(node) {
        distances[node] = Infinity;
        previous[node] = null;
        nodes.add(node);
      });
      distances[start] = 0;

      while (nodes.size > 0) {
        let closestNode = null;
        nodes.forEach(function(node) {
          if (closestNode === null || distances[node] < distances[closestNode]) {
            closestNode = node;
          }
        });

        if (distances[closestNode] === Infinity) break;

        nodes.delete(closestNode);

        let neighbors = graph.neighbors(closestNode);
        neighbors.forEach(function(neighbor) {
          let alt = distances[closestNode] + graph.edge(closestNode, neighbor).weight;
          if (alt < distances[neighbor]) {
            distances[neighbor] = alt;
            previous[neighbor] = closestNode;
          }
        });
      }

      // بناء المسار
      let path = [];
      let currentNode = end;
      while (currentNode) {
        path.unshift(currentNode);
        currentNode = previous[currentNode];
      }

      return path;
    }

    // تحميل بيانات شبكة الطرق (GeoJSON)
    fetch('https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/Road.geojson')
      .then(response => response.json())
      .then(data => {
        var graph = new graphlib.Graph();
        data.features.forEach(function(feature) {
          var id = feature.properties.name;
          var coordinates = feature.geometry.coordinates;

          // إضافة النقاط إلى الرسم البياني
          graph.setNode(id, { lat: coordinates[0], lon: coordinates[1] });

          // إضافة الحواف بين النقاط
          if (feature.geometry.type === "LineString") {
            for (let i = 0; i < coordinates.length - 1; i++) {
              var from = coordinates[i];
              var to = coordinates[i + 1];
              graph.setEdge(from.toString(), to.toString(), { weight: 1 });
            }
          }
        });

        // بمجرد تحميل الشبكة، نفذ عملية التوجيه
        document.getElementById('get-directions-btn').addEventListener('click', function() {
          const destination = document.getElementById('destination-input').value.trim();

          if (!destination || !userCoordinates) {
            alert("الرجاء تحديد الموقع والوجهة");
            return;
          }

          // البحث عن أقرب نقاط
          let start = userCoordinates.toString();
          let end = destination; // سنفترض أنه يتم التحديد هنا.

          // استخدام خوارزمية Dijkstra لحساب المسار
          let path = dijkstra(graph, start, end);

          // قم بإنشاء مسار جديد على الخريطة
          let latlngs = path.map(function(node) {
            return graph.node(node);
          });

          routingControl = L.Routing.control({
            waypoints: latlngs.map(function(latlng) {
              return L.latLng(latlng.lat, latlng.lon);
            }),
            routeWhileDragging: true,
            language: 'ar'
          }).addTo(map);
        });
      });
  </script>
</body>
</html>
