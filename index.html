<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تحليل المسارات - خطوط الباص</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <style>
        html, body, #map {
            height: 100%;
            margin: 0; padding: 0;
        }
        #route-info-panel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 1000;
            display: none;
            text-align: center;
            font-size: 16px;
            color: #333;
        }
        #route-info-panel strong {
            color: #1976d2;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="route-info-panel">
    <strong>معلومات المسار:</strong><br>
    المسافة: <span id="route-distance"></span><br>
    المدة: <span id="route-duration"></span>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    var map = L.map('map').setView([31.9, 35.2], 9); // تمركز الخريطة على الضفة الغربية

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 20
    }).addTo(map);

    // متغيرات لحفظ إحداثيات البداية والنهاية
    var startCoordinates = null;
    var destinationCoordinates = null;
    var routingControl = null;
    var busLineLayer = null;

    // تحميل بيانات خطوط الباص (من ملف JSON)
    fetch('https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/bus%20line.json')
    .then(response => response.json())
    .then(data => {
        // عند تحميل بيانات خطوط الباص من الملف
        window.busLineData = data; // حفظ البيانات للاستخدام لاحقًا
    })
    .catch(error => console.error('خطأ في تحميل بيانات خط الباص:', error));

    // عند الضغط على الخريطة
    map.on('click', function(e) {
        if (!startCoordinates) {
            // تحديد نقطة البداية
            startCoordinates = [e.latlng.lat, e.latlng.lng];
            L.marker(startCoordinates).addTo(map).bindPopup("نقطة البداية").openPopup();
            document.getElementById('route-info-panel').style.display = 'none'; // إخفاء معلومات المسار
        } else if (!destinationCoordinates) {
            // تحديد نقطة الوجهة
            destinationCoordinates = [e.latlng.lat, e.latlng.lng];
            L.marker(destinationCoordinates).addTo(map).bindPopup("الوجهة").openPopup();

            // رسم المسار بين النقطتين
            initiateRouting();
        }
    });

    // دالة رسم المسار بين النقاط
    function initiateRouting() {
        // إذا كانت هناك نقطة البداية والنهاية
        if (startCoordinates && destinationCoordinates) {
            if (routingControl) {
                map.removeControl(routingControl); // إزالة المسار السابق
            }

            // إنشاء التحكم في التوجيه
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(startCoordinates[0], startCoordinates[1]),
                    L.latLng(destinationCoordinates[0], destinationCoordinates[1])
                ],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                }),
                routeWhileDragging: true,
                language: 'ar',
                showAlternatives: false,
                lineOptions: {
                    styles: [{color: 'red', weight: 6, opacity: 0.8}] // تعيين لون المسار إلى الأحمر
                },
                createMarker: function() { return null; }
            }).addTo(map);

            // عند إيجاد المسار، نعرض المسافة والوقت
            routingControl.on('routesfound', function(e) {
                var routes = e.routes;
                var summary = routes[0].summary;
                document.getElementById('route-distance').textContent = (summary.totalDistance / 1000).toFixed(2) + ' كم';
                document.getElementById('route-duration').textContent = Math.round(summary.totalTime / 60) + ' دقيقة';
                document.getElementById('route-info-panel').style.display = 'block'; // إظهار لوحة المعلومات
            });

            // استخدام بيانات خط الباص (رسم الخط على الخريطة بين النقطتين)
            drawBusLine(startCoordinates, destinationCoordinates);
        }
    }

    // دالة رسم خط الباص بين نقطتين
    function drawBusLine(start, end) {
        if (busLineLayer) {
            map.removeLayer(busLineLayer); // إزالة الخط السابق إذا كان موجود
        }

        // البحث عن الخط الأقرب بين النقاط المحددة
        let busLine = findNearestBusLine(start, end);
        if (busLine) {
            busLineLayer = L.polyline(busLine, {color: 'blue', weight: 4}).addTo(map); // رسم خط الباص باللون الأزرق
            map.fitBounds(busLineLayer.getBounds()); // تكبير الخريطة لتناسب المسار
        } else {
            alert("لم يتم العثور على خط باص قريب من النقاط المحددة.");
        }
    }

    // دالة للبحث عن أقرب خط باص بين نقطتين
    function findNearestBusLine(start, end) {
        // من هنا يمكنك إضافة منطقك للبحث عن أقرب خط باص من البيانات
        // سنقوم بتحديد نقطة البداية والنهاية بين خطوط الباص
        if (window.busLineData) {
            for (let i = 0; i < window.busLineData.features.length; i++) {
                let line = window.busLineData.features[i];
                let coordinates = line.geometry.coordinates;

                // إضافة منطق تحديد الخط الأقرب هنا
                // سنرجع الخط الأقرب كنموذج فقط
                if (coordinates && coordinates.length > 1) {
                    return coordinates.map(coord => [coord[1], coord[0]]); // تحويل الإحداثيات إلى [lat, lng]
                }
            }
        }
        return null;
    }
</script>

</body>
</html>
