<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>خريطة مسار من جنين إلى رام الله مع الحواجز المغلقة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0; padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script>
    var map = L.map('map').setView([31.9, 35.2], 9); // View centered on the West Bank

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }).addTo(map);

    var busIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/logo%20Bus.svg', 
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    var openCheckpointIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/Logo%20checkpoints_T.svg',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    var closedCheckpointIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/WestBank-Traffic/WestBank-Traffic/main/Logo%20checkpoints.svg',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    var userLocationMarker = null;
    var userCoordinates = null;

    // حواجز مغلقة (إحداثيات وهمية)
    var closedCheckpoints = [
      { coords: [32.4000, 35.3500], name: "المدخل الشمالي لمدينة البيرة", status: "مغلق" },
      { coords: [32.4200, 35.3200], name: "طريق حزما", status: "مغلق" },
      { coords: [32.4100, 35.2900], name: "العيزرية", status: "مغلق" }
    ];

    // إضافة الحواجز المغلقة إلى الخريطة
    closedCheckpoints.forEach(function(checkpoint) {
      L.marker(checkpoint.coords, {icon: closedCheckpointIcon})
        .addTo(map)
        .bindPopup(`<b>${checkpoint.name}</b><br/>حالة الحاجز: مغلق`);
    });

    document.getElementById('location-btn').addEventListener('click', function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          userCoordinates = [position.coords.latitude, position.coords.longitude];

          if (userLocationMarker) {
            userLocationMarker.setLatLng(userCoordinates);
          } else {
            userLocationMarker = L.marker(userCoordinates).addTo(map).bindPopup("موقعك الحالي").openPopup();
          }

          map.setView(userCoordinates, 13);
        });
      } else {
        alert("لم يتمكن المتصفح من الحصول على موقعك.");
      }
    });

    // إحداثيات جنين ورام الله
    var jenin = [32.4519, 35.3020];
    var ramallah = [31.9074, 35.2034];

    // تحديد المسار بين جنين ورام الله
    var routeControl = L.Routing.control({
      waypoints: [
        L.latLng(jenin),
        L.latLng(ramallah)
      ],
      routeWhileDragging: true
    }).addTo(map);

    // دالة لإعادة حساب المسار إذا كان هناك حاجز مغلق
    function reRouteIfBlocked() {
      var newWaypoints = [jenin, ramallah]; // مسار افتراضي

      // إذا كان الحاجز مغلقًا على الطريق، سيعاد الحساب
      closedCheckpoints.forEach(function(checkpoint) {
        var latLngCheckpoint = L.latLng(checkpoint.coords);
        // التحقق مما إذا كانت الحواجز مغلقة
        if (routeControl.getRoute().getLatLngs().some(function(latLng) {
          return latLng.equals(latLngCheckpoint);
        })) {
          alert(`${checkpoint.name} مغلق، سيتم تغيير المسار.`);
          newWaypoints = [jenin, ramallah]; // تحديث المسار إذا كانت الحواجز مغلقة
          routeControl.setWaypoints(newWaypoints); // تغيير المسار
        }
      });
    }

    // التحقق من الحواجز المغلقة عند تحميل الخريطة
    reRouteIfBlocked();
  </script>
</body>
</html>
