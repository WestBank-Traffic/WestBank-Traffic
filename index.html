<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رسم مسار بين نقطتين</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <style>
        html, body, #map {
            height: 100%;
            margin: 0; padding: 0;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
    // تعيين الخريطة
    var map = L.map('map').setView([31.9024, 35.2032], 9); // تمركز الخريطة على الضفة الغربية (رام الله)

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 20
    }).addTo(map);

    // إحداثيات نقطة البداية (رام الله)
    var startCoordinates = [31.9024, 35.2032];
    // إحداثيات نقطة الوجهة (نابلس)
    var destinationCoordinates = [32.2211, 35.2544];

    // رسم المسار بين النقاط
    var routingControl = L.Routing.control({
        waypoints: [
            L.latLng(startCoordinates[0], startCoordinates[1]),
            L.latLng(destinationCoordinates[0], destinationCoordinates[1])
        ],
        router: L.Routing.osrmv1({
            serviceUrl: 'https://router.project-osrm.org/route/v1'
        }),
        routeWhileDragging: true,
        language: 'ar',
        showAlternatives: false,
        lineOptions: {
            styles: [{color: 'red', weight: 6, opacity: 0.8}] // المسار باللون الأحمر
        },
        collapsible: true,
        createMarker: function() { return null; } // لا يتم إنشاء علامات على المسار
    }).addTo(map);

    // عند إيجاد المسار، نعرض المسافة والوقت
    routingControl.on('routesfound', function(e) {
        var routes = e.routes;
        var summary = routes[0].summary;
        alert('المسافة: ' + (summary.totalDistance / 1000).toFixed(2) + ' كم\nالمدة: ' + Math.round(summary.totalTime / 60) + ' دقيقة');
        map.fitBounds(routingControl.getPlan().getWaypoints()[0].latLng.toBounds(100)); // تكبير/تصغير الخريطة لتناسب المسار
    });

    routingControl.on('routingerror', function(e) {
        alert('لم يتم العثور على مسار للوجهة المحددة.');
    });
</script>

</body>
</html>
