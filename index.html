<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>خريطة مسار من جنين إلى رام الله مع حواجز مغلقة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0; padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script>
    var map = L.map('map').setView([31.9, 35.2], 9); // View centered on the West Bank

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }).addTo(map);

    // Define coordinates for Jenin and Ramallah
    var jenin = [32.4519, 35.3020];
    var ramallah = [31.9074, 35.2034];

    // Define closed checkpoint locations along the route
    var closedCheckpoints = [
      [32.4000, 35.3500], // Example coordinates for a closed checkpoint
      [32.4500, 35.2900], // Another example coordinate
      [32.4200, 35.3100]  // Another example coordinate
    ];

    // Add closed checkpoints to the map with red icons
    var closedCheckpointIcon = L.icon({
      iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Stop_Icon.svg/1200px-Stop_Icon.svg.png',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    closedCheckpoints.forEach(function(coord) {
      L.marker(coord, {icon: closedCheckpointIcon})
        .addTo(map)
        .bindPopup("حاجز مغلق");
    });

    // Create a route between Jenin and Ramallah using Leaflet Routing Machine
    L.Routing.control({
      waypoints: [
        L.latLng(jenin),
        L.latLng(ramallah)
      ],
      routeWhileDragging: true
    }).addTo(map);

  </script>
</body>
</html>
